<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รักนะเพื่อน ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
    font-family:'Kanit',sans-serif;
}

.container{
    text-align:center;
    color:white;
}

h1{
    font-size:3rem;
    text-shadow:0 0 15px rgba(255,255,255,0.8);
}

#message{
    font-size:1.5rem;
    margin-top:20px;
    min-height:50px;
}

.heart{
    position:absolute;
    color:red;
    font-size:20px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-50px);
        opacity:1;
    }
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>❤️ ภาคินรักแฟนทุกคนเลยน๊า ❤️</h1>
    <div id="message"></div>
</div>

<script>
// ข้อความบอกรัก
const text = " เค้ารักฝนมากนะ ฝนมัสปรางเอ๋ปอแจงหน่อยบีจิ๋มแมว🥰";

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
    }
}
typeWriter();

// หัวใจตก
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 250);
</script>

</body>
</html>
